version: 2
updates:
  # Keeps SHA-pinned actions current (CICD-01). NuGet, npm, Terraform and Docker ecosystems are
  # added when the first service, web app and stacks exist (Phases 3-4).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
